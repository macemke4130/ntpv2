<!DOCTYPE html>
<html lang="en">
  <head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-C850TG6F0H"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-C850TG6F0H");
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A challenging and fun game for bicycle mechanics and nerds." />
    <meta property="og:title" content="Name That Part" />
    <meta property="og:description" content="A challenging and fun game for bicycle mechanics and nerds." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.namethatpart.com/" />
    <meta property="og:image" content="https://www.namethatpart.com/images/PXL_20210930_221619580.jpg" />
    <link rel="stylesheet" media="screen" href="./styles.css" />
    <link rel="stylesheet" media="screen" href="./play.css" />
    <title>Name That Part | Play</title>
  </head>
  <body>
    <main>
      <div data-game-curtain="up">
        <section aria-label="Images">
          <img data-quiz-image="one" data-blur="true" alt="" loading="eager" />
          <img data-quiz-image="two" data-blur="true" alt="" loading="eager" />
        </section>
        <section aria-label="Answers" data-blur="true">
          <div id="hint">What is this part called? Choose your answer below.</div>
          <button data-quiz-button class="glow"></button>
          <button data-quiz-button class="glow"></button>
          <button data-quiz-button class="glow"></button>
          <button data-quiz-button class="glow"></button>
        </section>
        <section aria-label="Score" data-blur="true">
          <div>
            <div id="current-points">500</div>
            <div class="points-label">Possible Points</div>
          </div>
          <div>
            <div id="total-points">0</div>
            <div class="points-label">Total Points</div>
          </div>
        </section>
        <section aria-label="Game Progress" data-blur="true">
          <div id="progress-text">0 out of 0</div>
          <div id="fake-progress-bar-background">
            <div id="fake-progress-bar"></div>
          </div>
          <progress id="progress-bar" value="0" max="0"></progress>
        </section>
      </div>
      <div data-game-over>
        <section id="game-over-screen" data-game-end-type data-screen-active="false">
          <h2 id="game-over-title"></h2>
          <div id="final-score-title">Total Points</div>
          <div id="final-score"></div>
          <div id="fun-score"></div>
          <div id="correct"></div>
          <div id="scoreboard-offset"></div>
          <button id="play-again">Play Again?</button>
          <div id="difficulty-selection">
            Select Difficulty Mode
            <div id="play-mode-buttons">
              <button id="rookie-mode" data-game-mode="r">Rookie</button>
              <button id="veteran-mode" data-game-mode="v">Veteran</button>
            </div>
            <div id="veteran-plug-text">Play in Veteran Mode to join the scoreboard</div>
          </div>
          <button id="share">Share Name That Part with friends</button>
        </section>
        <section id="rookie-game-over">
          <div id="rookie-score"></div>
          <ol id="rookie-results"></ol>
        </section>
        <table id="scoreboard">
          <thead>
            <tr>
              <th scope="col">Rank</th>
              <th scope="col">Name</th>
              <th scope="col">Final Score</th>
              <th scope="col">Parts Named</th>
              <th scope="col">Local Time</th>
            </tr>
          </thead>
          <tbody data-active="false"></tbody>
          <tfoot></tfoot>
        </table>
        <div id="total-games" class="credit"></div>
      </div>
      <dialog id="player-name">
        <div id="player-form-container">
          <div id="player-title">Enter your name for the scoreboard</div>
          <label>
            Name
            <input id="player-name-text" type="text" autocomplete="off" maxlength="32" />
            <div id="player-name-buttons">
              <button id="submit-player-name">Submit</button>
              <button id="cancel-player-name">Cancel</button>
            </div>
          </label>
        </div>
      </dialog>
    </main>

    <!-- Preload next part images -->
    <div id="preload" aria-hidden="true">
      <img alt="" />
      <img alt="" />
    </div>

    <div id="countdown-to-start">
      <div id="countdown-container">
        <div id="countdown-seconds" data-color="red"></div>
      </div>
    </div>

    <footer id="footer"></footer>

    <noscript>
      <div id="no-script-alert-container">You will need to allow Javascript to play this game.</div>
    </noscript>

    <script>
      // TS Hack. Fix later.
      var exports = {};
    </script>
    <script src="./footer.js"></script>
    <script src="./play.js"></script>
  </body>
</html>
